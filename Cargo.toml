[workspace]
resolver = "3"
members = ["crates/core", "crates/adapters", "crates/app"]

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/SKorhacker/omni-strike"
publish = false

[workspace.dependencies]
oa-core = { path = "crates/core" }
oa-adapters = { path = "crates/adapters" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
rust_decimal = { version = "1.43", features = ["serde-with-str"] }
rust_decimal_macros = "1.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

# Smaller, faster dev builds.
[profile.dev]
incremental = false
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Production build: whole-crate optimisation across the workspace. `panic` stays "unwind": Kameo
# supervises actors by catching panics, abort would turn one actor panic into a process crash.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
