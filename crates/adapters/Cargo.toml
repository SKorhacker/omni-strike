[package]
name = "oa-adapters"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Platform connectors: native API -> canonical types. No routing policy here."

[features]
# Tests that hit real public endpoints. Opt-in: `cargo test -p oa-adapters --features live-tests`.
live-tests = []

[dependencies]
oa-core.workspace = true
async-trait.workspace = true
chrono.workspace = true
futures-util = "0.3"
hex.workspace = true
hmac = "0.12"
k256 = { version = "0.14", features = ["ecdsa"] }
sha2.workspace = true
sha3 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "native-tls", "http2", "gzip", "brotli", "deflate"] }
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
tracing.workspace = true

[dev-dependencies]
axum = "0.8"
rust_decimal_macros.workspace = true
