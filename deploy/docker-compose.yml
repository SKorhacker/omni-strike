# Omni Strike — single-node production stack.
#
#   cd deploy && cp .env.example .env && $EDITOR .env      # fill secrets locally
#   docker compose build
#   docker compose up -d                                    # db + oa-server + web
#   docker compose --profile proxy up -d                    # + Caddy (HTTPS on OA_DOMAIN)
#   docker compose --profile monitoring up -d               # + Prometheus/Grafana stubs
#
# Compose reads deploy/.env for ${...} interpolation automatically (project dir = deploy/).
# Published ports bind to 127.0.0.1 only; the public entry point is Caddy (80/443).

name: omni-strike

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

# Third-party images are pinned (no `latest`): an upgrade is a reviewed change, never a surprise.
services:
  db:
    <<: *hardening
    image: postgres:16.4
    # The official entrypoint needs a few capabilities to chown/drop to the postgres user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: oa
      POSTGRES_PASSWORD: ${OA_PG_PASSWORD:?set OA_PG_PASSWORD in deploy/.env}
      POSTGRES_DB: options_aggregator
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - oa-pg:/var/lib/postgresql/data
    # No published port: only reachable on the internal network. For psql from the host:
    #   docker compose exec db psql -U oa options_aggregator
    networks: [backend]
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oa -d options_aggregator -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }
        reservations: { memory: 256m }

  oa-server:
    <<: *hardening
    image: omni-strike/oa-server:${OA_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        CARGO_FEATURES: ""   # "testnet" ONLY for a testnet image with its own tag/database
    env_file:
      - .env
    environment:
      # Overrides env_file. Hex-only password (see .env.example) so no URL escaping is needed.
      DATABASE_URL: postgres://oa:${OA_PG_PASSWORD:?set OA_PG_PASSWORD}@db:5432/options_aggregator
      OA_BIND: 0.0.0.0:8080
      OA_API_TOKEN: ${OA_API_TOKEN:?OA_API_TOKEN is required for a non-loopback bind}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, frontend]
    # Direct API access from the host only (SSH tunnel for admin calls). Public access via Caddy.
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    stop_signal: SIGTERM       # oa-server drains on SIGTERM/SIGINT (25 s), below the grace period
    stop_grace_period: 30s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1g }
        reservations: { cpus: "0.25", memory: 256m }
    # HEALTHCHECK comes from the image (/health/ready).

  web:
    <<: *hardening
    image: omni-strike/web:${OA_WEB_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        # Baked into the Next.js rewrites at build time (see deploy/web.Dockerfile).
        OA_BACKEND_URL: http://oa-server:8080
    environment:
      OA_BACKEND_URL: http://oa-server:8080
    depends_on:
      oa-server:
        condition: service_started
    networks: [frontend]
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /web/.next/cache:size=128m,uid=1000,gid=1000
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512m }
        reservations: { memory: 128m }

  caddy:
    <<: *hardening
    profiles: [proxy]
    image: caddy:2.8
    cap_add: [NET_BIND_SERVICE]
    environment:
      OA_DOMAIN: ${OA_DOMAIN:?set OA_DOMAIN for the proxy profile}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL for the proxy profile}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - oa-server
    networks: [frontend]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 256m }

  # ---------------------------------------------------------------------------------------------
  # Monitoring STUBS (profile "monitoring"). oa-server exposes JSON metrics at /v1/metrics (bearer
  # token required), not Prometheus text format: scraping it needs a json_exporter or a future
  # /metrics endpoint. Postgres metrics work out of the box via postgres-exporter.
  # ---------------------------------------------------------------------------------------------
  postgres-exporter:
    <<: *hardening
    profiles: [monitoring]
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://oa:${OA_PG_PASSWORD:?set OA_PG_PASSWORD}@db:5432/options_aggregator?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

  prometheus:
    <<: *hardening
    profiles: [monitoring]
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [backend, frontend]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512m }

  grafana:
    <<: *hardening
    profiles: [monitoring]
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"   # reach it through an SSH tunnel, never publicly
    depends_on:
      - prometheus
    networks: [backend]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }

networks:
  backend:
    internal: false   # oa-server needs egress to the venues; db has no published port
  frontend: {}

volumes:
  oa-pg:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
